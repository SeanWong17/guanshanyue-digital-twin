name: Windows desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Install and test actual Windows package
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release/*-Setup-*.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'GuanshanyueInstalled'
          $process = Start-Process $installer -ArgumentList '/S', "/D=$installDir" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:DESKTOP_EXE = Join-Path $installDir 'Guanshanyue.exe'
          if (!(Test-Path $env:DESKTOP_EXE)) { throw 'Installed executable missing' }
          npm run test:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop verification failed' }
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe,release/*.zip | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Guanshanyue-Windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
            test-results/desktop.png
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem release/*.exe,release/*.zip,release/SHA256SUMS.txt).FullName
          gh release create $env:GITHUB_REF_NAME @assets --title "Guanshanyue $env:GITHUB_REF_NAME · Windows 桌面版" --notes-file RELEASE_NOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
